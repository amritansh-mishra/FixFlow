# Render Blueprint: the API (web service), the frontend (static site) and a PostgreSQL database.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
databases:
  - name: fixflow-db
    plan: free
    databaseName: fixflow
    user: fixflow

services:
  - type: web
    name: fixflow-api
    runtime: node
    plan: free
    # --include=dev: TypeScript is a dev dependency but needed to build.
    buildCommand: npm ci --include=dev && npm run build
    # Migrate, seed the demo organization (once), then start the server.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      # Password for the demo accounts; you're asked for it when deploying.
      - key: DEMO_PASSWORD
        sync: false
      # The frontend's URL (e.g. https://fixflow-web.onrender.com), so browsers may call the API.
      - key: CORS_ORIGINS
        sync: false

  # The React frontend, built once and served as static files.
  - type: web
    name: fixflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's URL (e.g. https://fixflow-api.onrender.com). Baked in at build time,
      # so redeploy the frontend after changing it.
      - key: VITE_API_URL
        sync: false
