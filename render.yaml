# Render Blueprint: one web service + one PostgreSQL database.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
databases:
  - name: fixflow-db
    plan: free
    databaseName: fixflow
    user: fixflow

services:
  - type: web
    name: fixflow-api
    runtime: node
    plan: free
    # --include=dev: TypeScript is a dev dependency but needed to build.
    buildCommand: npm ci --include=dev && npm run build
    # Migrate, seed the demo organization (once), then start the server.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      # Password for the demo accounts; you're asked for it when deploying.
      - key: DEMO_PASSWORD
        sync: false
