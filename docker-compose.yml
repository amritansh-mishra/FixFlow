# Local development services. Start with: docker compose up -d
#
# This PostgreSQL is separate from any PostgreSQL installed on your machine:
# it listens on port 5433 (not the usual 5432) and keeps its data in a Docker
# volume. The passwords below are for local development only.
services:
  postgres:
    # Official PostgreSQL 18, small Alpine Linux variant (same as CI).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Created automatically on the first start.
      POSTGRES_DB: fixflow
    ports:
      # Your machine's port 5433 → port 5432 inside the container.
      # 127.0.0.1 = reachable from this computer only, not from other devices
      # on the network (the dev password here is not a secret).
      - "127.0.0.1:5433:5432"
    volumes:
      # Keep the data in a named volume so it survives container restarts.
      - pgdata:/var/lib/postgresql
      # Creates the restricted app role on first start (see the file).
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      # Docker asks "are you ready?" every 5 seconds.
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: a fast in-memory store. BullMQ keeps its job queues here.
  redis:
    image: redis:8.8-alpine
    # --appendonly yes: also write every change to disk, so queued jobs
    # survive a restart instead of vanishing with the memory.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # This computer only, like PostgreSQL.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mailpit: a pretend mail server for development. The app "sends" email to
  # it; Mailpit keeps every message and shows it at http://localhost:8025.
  # Nothing ever reaches a real inbox.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      # This computer only, like the others.
      - "127.0.0.1:1025:1025" # SMTP: where the app sends email
      - "127.0.0.1:8025:8025" # web page to read the "sent" emails

  # SeaweedFS: a local S3-compatible file store, standing in for Cloudflare
  # R2 (production). Same code, different address (see docs.md chapter 34).
  # The keys in docker/seaweedfs-s3.json are for local development only.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      # This computer only, like the others.
      - "127.0.0.1:8333:8333" # S3 API
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  seaweeddata:
